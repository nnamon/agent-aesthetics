name: Deploy reference pages to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# allow GITHUB_TOKEN to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# allow only one concurrent deployment; don't cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload reference site as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # serve only the reference pages so URLs are clean —
          # /index.html is the hub, /log.html, /charts.html, etc.
          path: references/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
